# OpenOCD 配置文件 for WB32L003
# 基于 STM32F0 配置修改

# 使用 ST-Link V2 或兼容的调试器
source [find interface/stlink.cfg]

# 芯片配置
set WORKAREASIZE 0x1000
set CHIPNAME wb32l003
set ENDIAN little

# SWD 传输配置
transport select hla_swd

# 目标配置
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -chain-position $_TARGETNAME

# 工作区配置（使用 SRAM）
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $WORKAREASIZE -work-area-backup 0

# Flash 配置
set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME stm32f1x 0x08000000 0x10000 0 0 $_TARGETNAME

# 时钟配置
adapter speed 1000

# 复位配置
reset_config srst_only srst_nogate

# 初始化
init
reset init